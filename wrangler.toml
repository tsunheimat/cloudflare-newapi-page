name = "cloudflare-newapi-page"
main = "src/worker.js"
compatibility_date = "2026-08-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
# Fixture remains the safety default for the top-level and staging environments.
# The explicitly authorized production named environment selects the reviewed
# NewAPI adapter after the VPC path and Worker secret were provisioned and
# verified by the controller.
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "disabled"
R2_PREFIX = "codex-install"
R2_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"
JUAPI_HOME_URL = "https://www.juaiapi.com"
WECHAT_GROUP_QR_PREFIX = "wechat-group-qrcode"
WECHAT_GROUP_QR_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"
CODEX_CHAT_RECORD_MIGRATOR_R2_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"

# Service bindings, R2 buckets, and vars are non-inheritable Wrangler
# environment keys. Staging keeps the old download Worker as a rollback
# transport; production adds the reviewed tokenrouter R2 authority and keeps
# the old binding intact for rollback.
[env.staging]
workers_dev = true

[env.staging.vars]
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "staging-service-binding"
R2_PREFIX = "codex-install"
R2_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"
JUAPI_HOME_URL = "https://www.juaiapi.com"
WECHAT_GROUP_QR_PREFIX = "wechat-group-qrcode"
WECHAT_GROUP_QR_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"
CODEX_CHAT_RECORD_MIGRATOR_R2_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"

[[env.staging.services]]
binding = "DOWNLOADS_SERVICE"
service = "cloudflare-download-site"

[[env.staging.vpc_services]]
binding = "NEWAPI_VPC_SERVICE"
service_id = "01a027bb-280d-7630-b837-7afd6a0ca196"

[env.production]
name = "cloudflare-newapi-page-production"
workers_dev = true

[env.production.vars]
CONTENT_ADAPTER = "newapi"
DOWNLOADS_INTEGRATION = "production-r2-binding"
R2_PREFIX = "codex-install"
R2_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"
JUAPI_HOME_URL = "https://www.juaiapi.com"
WECHAT_GROUP_QR_PREFIX = "wechat-group-qrcode"
WECHAT_GROUP_QR_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"
CODEX_CHAT_RECORD_MIGRATOR_R2_PUBLIC_BASE_URL = "https://tokenrouter-r2.wdtokenacc.top"

[[env.production.r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "tokenrouter"

[[env.production.services]]
binding = "DOWNLOADS_SERVICE"
service = "cloudflare-download-site"

[[env.production.vpc_services]]
binding = "NEWAPI_VPC_SERVICE"
service_id = "01a027bb-280d-7630-b837-7afd6a0ca196"
