name = "cloudflare-newapi-page"
main = "src/worker.js"
compatibility_date = "2026-08-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
# Phase 1 deliberately serves explicit fixture data. The future NewAPI adapter
# will be selected here only after its private connectivity and live contracts
# have been verified.
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "disabled"

# Service bindings and vars are non-inheritable Wrangler environment keys.
# Only the staging environment opts into the existing download Worker.
[env.staging]
workers_dev = true

[env.staging.vars]
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "staging-service-binding"

[[env.staging.services]]
binding = "DOWNLOADS_SERVICE"
service = "cloudflare-download-site"

# Keep an explicit named production environment fail-closed as well as the
# default/top-level environment above. Neither has a DOWNLOADS_SERVICE entry.
[env.production]
workers_dev = true

[env.production.vars]
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "disabled"
