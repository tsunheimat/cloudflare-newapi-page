name = "cloudflare-newapi-page"
main = "src/worker.js"
compatibility_date = "2026-08-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
# Phase 1 deliberately serves explicit fixture data. The future NewAPI adapter
# will be selected here only after its private connectivity and live contracts
# have been verified.
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "disabled"

# Service bindings and vars are non-inheritable Wrangler environment keys.
# Staging and the named production environment opt into the same already
# deployed download Worker with environment-specific runtime gates.
[env.staging]
workers_dev = true

[env.staging.vars]
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "staging-service-binding"

[[env.staging.services]]
binding = "DOWNLOADS_SERVICE"
service = "cloudflare-download-site"

[env.production]
workers_dev = true

[env.production.vars]
CONTENT_ADAPTER = "fixture"
DOWNLOADS_INTEGRATION = "production-service-binding"

[[env.production.services]]
binding = "DOWNLOADS_SERVICE"
service = "cloudflare-download-site"
